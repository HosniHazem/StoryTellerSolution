<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/x-icon" href="/assets/getstoryteller_logo.ico">
  <title>Story Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    /* Story Container - Fits all screens */
    .story-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Story Page - Responsive to all screen sizes */
    .story-page {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      background: #1a1a1a;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    /* Desktop: max width constraint */
    @media (min-width: 768px) {
      .story-page {
        max-width: 450px;
        max-height: min(800px, 90vh);
        border-radius: 12px;
      }
    }

    /* Tablet landscape: wider but constrained */
    @media (min-width: 768px) and (max-width: 1024px) and (orientation: landscape) {
      .story-page {
        max-width: 600px;
        max-height: 85vh;
      }
    }

    /* Small phones: full screen, no border radius */
    @media (max-width: 374px) {
      .story-page {
        border-radius: 0;
      }
    }

    /* Page Background Image - Cover entire area */
    .page-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    .page-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
      z-index: 1;
    }

    /* Page Content - Safe area for all screens */
    .page-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top, 20px)) 
               max(20px, env(safe-area-inset-right, 20px))
               max(20px, env(safe-area-inset-bottom, 20px))
               max(20px, env(safe-area-inset-left, 20px));
    }

    /* Desktop: more padding */
    @media (min-width: 768px) {
      .page-content {
        padding: 40px 30px;
      }
    }

    /* Header */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .minute-badge {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: clamp(12px, 3vw, 14px);
      font-weight: 700;
      white-space: nowrap;
    }

    .page-counter {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: clamp(11px, 2.5vw, 13px);
      font-weight: 600;
      white-space: nowrap;
    }

    /* Main Content - Responsive typography */
    .page-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      padding: 20px 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .headline {
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 16px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      word-wrap: break-word;
      hyphens: auto;
    }

    .subheadline {
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: 500;
      opacity: 0.9;
      margin-bottom: 8px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      word-wrap: break-word;
    }

    .caption {
      font-size: clamp(18px, 4.5vw, 24px);
      font-weight: 600;
      margin-bottom: 16px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      word-wrap: break-word;
    }

    .explanation {
      font-size: clamp(14px, 3.5vw, 16px);
      line-height: 1.5;
      opacity: 0.85;
      max-width: 90%;
      margin: 0 auto;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      word-wrap: break-word;
    }

    .body-text {
      font-size: clamp(14px, 3.5vw, 16px);
      line-height: 1.5;
      opacity: 0.85;
      max-width: 90%;
      margin: 0 auto;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      word-wrap: break-word;
    }

    /* Navigation - Touch-friendly */
    .navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-shrink: 0;
      padding-top: 10px;
    }

    /* Small screens: smaller gaps */
    @media (max-width: 374px) {
      .navigation {
        gap: 10px;
      }
    }

    .nav-button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      padding: clamp(10px, 3vw, 14px) clamp(20px, 5vw, 28px);
      border-radius: 30px;
      font-size: clamp(13px, 3.2vw, 15px);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      white-space: nowrap;
      min-width: 80px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .nav-button:active:not(:disabled) {
      transform: scale(0.98);
    }

    .nav-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
      min-width: 50px;
    }

    .progress-fill {
      height: 100%;
      background: #fff;
      transition: width 0.3s ease;
      will-change: width;
    }

    /* Loading & Error States */
    .loading, .error {
      text-align: center;
      padding: 40px 20px;
      font-size: clamp(14px, 4vw, 18px);
    }

    .error {
      color: #ff4444;
    }

    /* Page Types Specific Styles */
    .page-type-cover .headline {
      font-size: clamp(40px, 10vw, 56px);
    }

    .page-type-info .page-main {
      justify-content: center;
      text-align: center;
    }

    /* Keyboard shortcuts hint - Hide on small screens */
    .shortcuts {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0.6;
      z-index: 10;
      white-space: nowrap;
    }

    @media (max-width: 767px) {
      .shortcuts {
        display: none;
      }
    }

    /* Prevent text selection on touch devices */
    @media (hover: none) {
      * {
        -webkit-user-select: none;
        user-select: none;
      }
      
      .body-text, .explanation {
        -webkit-user-select: text;
        user-select: text;
      }
    }

    /* Landscape orientation on phones: adjust layout */
    @media (max-height: 500px) and (orientation: landscape) {
      .page-content {
        padding: 15px 20px;
      }
      
      .page-main {
        padding: 10px 0;
      }
      
      .headline {
        font-size: clamp(24px, 6vw, 32px);
        margin-bottom: 10px;
      }
      
      .navigation {
        padding-top: 5px;
      }
    }

    /* High contrast mode support */
    @media (prefers-contrast: high) {
      .nav-button {
        border: 2px solid rgba(255, 255, 255, 0.5);
      }
      
      .minute-badge, .page-counter {
        border: 2px solid currentColor;
      }
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="story-container">
    <div id="story-viewer" class="story-page">
      <div class="loading">Loading story...</div>
    </div>
  </div>

  <div class="shortcuts">
    ← → Navigate • Space = Next
  </div>

  <script>
    // Story Viewer Logic
    let story = null;
    let currentPageIndex = 0;

    // Load story data
    async function loadStory() {
      try {
        const response = await fetch('/out/story.json');
        if (!response.ok) throw new Error('Failed to load story');
        story = await response.json();
        renderPage(0);
      } catch (error) {
        document.getElementById('story-viewer').innerHTML = `
          <div class="error">
            <h2>Failed to load story</h2>
            <p>${error.message}</p>
            <p>Make sure to run "npm run build" first!</p>
          </div>
        `;
      }
    }

    // Render a specific page
    function renderPage(index) {
      if (!story || index < 0 || index >= story.pages.length) return;

      currentPageIndex = index;
      const page = story.pages[index];
      const viewer = document.getElementById('story-viewer');

      // Build HTML based on page type
      let html = '';

      // Background image if present
      if (page.image) {
        html += `<img src="${page.image}" alt="" class="page-background">`;
        html += `<div class="page-overlay"></div>`;
      }

      html += `<div class="page-content">`;

      // Header
      html += `<div class="page-header">`;
      if (page.minute !== undefined) {
        html += `<div class="minute-badge">${page.minute}'</div>`;
      } else {
        html += `<div></div>`;
      }
      html += `<div class="page-counter">${index + 1} / ${story.pages.length}</div>`;
      html += `</div>`;

      // Main content based on type
      html += `<div class="page-main">`;
      
      if (page.type === 'cover') {
        html += `<h1 class="headline">${escapeHtml(page.headline)}</h1>`;
        if (page.subheadline) {
          html += `<p class="subheadline">${escapeHtml(page.subheadline)}</p>`;
        }
      } else if (page.type === 'highlight') {
        html += `<h1 class="headline">${escapeHtml(page.headline)}</h1>`;
        if (page.caption) {
          html += `<p class="caption">${formatRichText(page.caption, false)}</p>`;
        }
        if (page.explanation) {
          html += `<p class="explanation">${formatRichText(page.explanation, false)}</p>`;
        }
      } else if (page.type === 'info') {
        html += `<h2 class="headline">${escapeHtml(page.headline)}</h2>`;
        if (page.body) {
          html += `<p class="body-text">${formatRichText(page.body, true)}</p>`;
        }
      }

      html += `</div>`;

      // Navigation
      html += `<div class="navigation">`;
      html += `
        <button class="nav-button" onclick="previousPage()" ${index === 0 ? 'disabled' : ''}>
          ← Previous
        </button>
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${((index + 1) / story.pages.length) * 100}%"></div>
        </div>
        <button class="nav-button" onclick="nextPage()" ${index === story.pages.length - 1 ? 'disabled' : ''}>
          Next →
        </button>
      `;
      html += `</div>`;

      html += `</div>`;

      viewer.innerHTML = html;
      viewer.className = `story-page page-type-${page.type}`;
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Format rich text by escaping, converting newlines to <br>, and bolding key labels
    function formatRichText(text, withBreaks) {
      let html = escapeHtml(text);
      if (withBreaks) {
        html = html.replace(/\n/g, '<br />');
      }

      const patterns = [
        { regex: /Goal!/g, replacement: '<strong>Goal!</strong>' },
        { regex: /Score at the break:/g, replacement: '<strong>Score at the break:</strong>' },
        { regex: /\bPenalty\b/g, replacement: '<strong>Penalty</strong>' },
        { regex: /Full Time:/g, replacement: '<strong>Full Time:</strong>' },
        { regex: /Venue:/g, replacement: '<strong>Venue:</strong>' },
        { regex: /Competition:/g, replacement: '<strong>Competition:</strong>' }
      ];

      patterns.forEach(p => {
        html = html.replace(p.regex, p.replacement);
      });

      return html;
    }

    // Navigation functions
    function nextPage() {
      if (currentPageIndex < story.pages.length - 1) {
        renderPage(currentPageIndex + 1);
      }
    }

    function previousPage() {
      if (currentPageIndex > 0) {
        renderPage(currentPageIndex - 1);
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextPage();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        previousPage();
      }
    });

    // Touch navigation (swipe)
    let touchStartX = 0;
    let touchEndX = 0;
    let touchStartTime = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartTime = Date.now();
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeThreshold = 50;
      const timeThreshold = 500; // Max time for swipe
      const diff = touchStartX - touchEndX;
      const timeDiff = Date.now() - touchStartTime;

      // Only register as swipe if fast enough
      if (timeDiff < timeThreshold && Math.abs(diff) > swipeThreshold) {
        if (diff > 0) {
          nextPage();
        } else {
          previousPage();
        }
      }
    }

    // Prevent double-tap zoom on iOS
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    // Initialize
    loadStory();

    // Handle orientation changes
    window.addEventListener('orientationchange', () => {
      // Re-render current page to adjust layout
      if (story) {
        setTimeout(() => renderPage(currentPageIndex), 100);
      }
    });

    // Handle window resize (for desktop)
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (story) {
          renderPage(currentPageIndex);
        }
      }, 250);
    });
  </script>
</body>
</html>
